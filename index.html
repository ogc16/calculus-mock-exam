      </div>
      <div class="text-base mb-4">${item.q}</div>
      <button onclick="toggleSol(${i})" class="no-print bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold text-sm px-4 py-2 rounded-lg transition" id="btn-${i}">Show Solution</button>
      <div class="solution mt-4 p-4 bg-gray-50 rounded-lg border text-sm" id="sol-${i}">${item.sol}</div>
    </div>
  `;
});

function toggleSol(i) {
  const sol = document.getElementById('sol-'+i);
  const btn = document.getElementById('btn-'+i);
  sol.classList.toggle('open');
  btn.textContent = sol.classList.contains('open') ? 'Hide Solution' : 'Show Solution';
}

function toggleAll(show) {
  questions.forEach((_, i) => {
    const sol = document.getElementById('sol-'+i);
    const btn = document.getElementById('btn-'+i);
    if (show) { sol.classList.add('open'); btn.textContent = 'Hide Solution'; }
    else { sol.classList.remove('open'); btn.textContent = 'Show Solution'; }
  });
}
</script>
</body>
</html>
